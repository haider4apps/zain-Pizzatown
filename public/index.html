<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Pizza Town POS</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">PIZZA TOWN</div>
    <input class="search" id="search" placeholder="Search item..." autocomplete="off">
    <div class="sp"></div>
    <button class="btn stk out" id="btnOut" hidden title="Jo saman khatam hai">⛔<span class="lbl"> Khatam</span> <b>0</b></button>
    <button class="btn stk low" id="btnLow" hidden title="Jo saman kam hai">⚠<span class="lbl"> Kam</span> <b>0</b></button>
    <button class="btn" id="btnOrders">Orders</button>
    <span class="syncpill" id="syncPill" hidden></span>
    <button class="btn hide-m" id="btnStation" title="Is device se slips print hongi">Printer: OFF</button>
    <a class="btn hide-m toAdmin" href="/admin.html" style="text-decoration:none">Admin</a>
  </header>
  <nav id="tabs"></nav>
  <section id="menu"></section>
  <aside id="cart">
    <h2><span>Current Order <small id="cartCount" style="color:var(--mute)"></small></span>
      <span><button class="btn" id="clearCart">Clear</button> <button class="btn" id="closeCart">Close</button></span></h2>
    <div id="cartBody"></div>
    <div id="cartFoot">
      <div class="tot"><span>Total</span><span id="cartTotal">Rs 0</span></div>
      <button class="btn gold" id="checkoutBtn" style="padding:14px;font-size:18px">Checkout</button>
    </div>
  </aside>
</div>
<button id="cartbar"><span id="barCount">Cart</span><span id="barTotal">Rs 0</span></button>

<div class="modal" id="coModal"><div class="sheet" id="coSheet"></div></div>
<div class="modal" id="ordModal"><div class="sheet" id="ordSheet"></div></div>
<div id="toast"></div>
<datalist id="riders"></datalist>
<iframe id="printFrame" style="position:fixed;left:-9999px;width:1px;height:1px;border:0"></iframe>
<script src="/one.js"></script>
<script src="/fun.js"></script>
<script src="/app.js"></script>
</body>
</html>
