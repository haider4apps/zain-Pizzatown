<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza Town Admin</title>
<link rel="stylesheet" href="/style.css">
<style>
  body{overflow:auto}
  [hidden]{display:none!important}
  .wrap{max-width:980px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:14px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar .logo{margin-right:auto}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  #tabs.tabs{flex-direction:row;flex-wrap:wrap;overflow:visible;border:0;padding:0;background:none}
  #tabs.tabs button{padding:10px 18px}
  .tabs button{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
  .tabs button.on{background:var(--gold);color:#1a1405}
  details.sg{border:1px solid var(--line);border-radius:10px;margin-top:8px}
  details.sg{background:var(--panel2,#262a33)}
  details.sg summary{cursor:pointer;padding:14px 16px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:10px;font-size:18px;list-style:none;border-radius:10px}
  details.sg summary::-webkit-details-marker{display:none}
  details.sg summary:hover{background:rgba(232,185,76,.08)}
  details.sg .chev{display:inline-block;transition:transform .15s;font-size:16px}
  details.sg[open] .chev{transform:rotate(90deg)}
  details.sg .tap{color:var(--mute);font-weight:400;font-size:13px;margin-left:auto}
  details.sg[open] .tap{visibility:hidden}
  details.sg .redc{margin-left:8px}
  details.sg[open] summary{border-bottom:1px solid var(--line)}
  .sbar{display:flex;align-items:center;gap:10px}.sbar input{flex:1;min-width:0;font-size:17px;padding:11px 14px;background:#fff!important;color:#111!important;border:2px solid #fff!important;border-radius:10px}
#iItem.open,#bItem.open,#dItem.open{position:relative;z-index:5;min-width:320px;font-size:16px;background:#fff;color:#111;border:2px solid var(--gold);border-radius:10px}
  .sbar input::placeholder{color:#777}.sbar input:not(:placeholder-shown){border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(232,185,76,.35)}
  .sbar .sc{color:var(--mute);white-space:nowrap;font-size:13px}
  .sbar .sin{flex:1;min-width:0;position:relative;display:flex}.sbar .sin input{padding-right:44px}.sbar input::-webkit-search-cancel-button{display:none}
  .sbar .sx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:#e5e7eb;color:#111;font-size:16px;font-weight:700;cursor:pointer;line-height:1}.sbar .sx:hover{background:#f87171;color:#fff}.sbar .sx[hidden]{display:none}
  .sgtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .sgtile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--panel2,#262a33);color:var(--text,#eee);font-size:19px;font-weight:800;cursor:pointer;text-align:left}
  .sgtile small{color:var(--mute);font-weight:400;font-size:13px}.sgtile .chips{display:flex;gap:6px;min-height:26px}.sgtile .redc{margin:0;font-size:13px}
  .sgtile.on{border-color:var(--gold);background:rgba(232,185,76,.14);color:var(--gold)}
  .eform{display:flex;flex-direction:column;gap:10px}.eform[hidden]{display:none}
  .etiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .etile{padding:12px 10px;border-radius:10px;border:2px solid var(--line);background:var(--panel2,#262a33);color:var(--text,#eee);font-size:16px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;min-height:74px}
  .etile small{font-weight:400;font-size:11px;color:var(--mute);text-align:center}
  .etile.on{border-color:var(--gold);background:rgba(232,185,76,.16);color:var(--gold)}
  .etile.ora{background:#e8792b;border-color:#e8792b;color:#fff;grid-column:span 2}.etile.ora small{font-weight:400;font-size:12px;color:#fff}
  .etile.ora.on{background:#ff8f3f;border-color:#fff;color:#fff;box-shadow:0 0 0 3px rgba(232,121,43,.45)}
  .sgh{color:var(--gold);font-weight:800;font-size:17px;margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sgp .tw + .sgfoot{display:flex;justify-content:center;margin-top:8px}
  .sgtile:after{content:'▾ kholein';font-size:12px;font-weight:400;color:var(--mute)}.sgtile.on:after{content:'▴ band karein';color:var(--gold)}
  .drf{border:2px dashed var(--gold);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:rgba(232,185,76,.06)}
  .drh{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.drh .lc{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}.drh .redc{margin:0;cursor:help}.drh small{color:var(--mute)}
  .drfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.drfoot .btn.gold{font-size:17px;padding:12px 18px}
  .tw{overflow-x:auto}.stt td,.stt th{vertical-align:middle}.stt th small{font-weight:400;color:var(--mute)}
  .stt .cb{width:100%;min-width:92px;white-space:nowrap;justify-content:center;text-align:center}
  .redc{background:#e53935;color:#fff;border-radius:99px;min-width:26px;height:26px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;margin-left:auto}
  .redc.yel{background:#f5c04a;color:#3a2e10}
  .redc + .redc{margin-left:6px}
  tr.st-out td{background:rgba(229,57,53,.16)} tr.st-out td:first-child{border-left:4px solid #e53935}
  tr.st-low td{background:rgba(245,192,74,.12)} tr.st-low td:first-child{border-left:4px solid #f5c04a}
  .bandlist{margin-top:10px;display:flex;flex-direction:column;gap:6px}.bandrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border-left:4px solid #6b7280;border-radius:8px;padding:6px 10px}.bandrow small{color:var(--mute)}
  tr.dm-red td{background:rgba(229,57,53,.16)} tr.dm-red td:first-child{border-left:4px solid #e53935}
  tr.dm-yel td{background:rgba(245,192,74,.12)} tr.dm-yel td:first-child{border-left:4px solid #f5c04a}
  tr.dm-grn td{background:rgba(76,175,80,.10)} tr.dm-grn td:first-child{border-left:4px solid #4caf50}
  .btn.rng.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn:active{transform:scale(.96)}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .item{background:var(--panel2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
  .item.off{opacity:.55}
  .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .r>*{flex:1 1 120px}.r>.s{flex:0 0 auto}.r>.n{flex:0 0 110px}
  .vrow{display:flex;gap:8px;align-items:center}
  .vrow input[type=number]{flex:0 0 110px}.vrow input[type=text]{flex:1}
  .vrow label,.r label.s{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);white-space:nowrap}
  .vrow input[type=checkbox],.r input[type=checkbox]{width:20px;height:20px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mute);font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat{background:var(--panel2);border-radius:12px;padding:12px}.stat small{color:var(--mute)}.stat b{display:block;font-size:22px;color:var(--gold)}
  select#catSel{max-width:360px}
  #login{max-width:340px;margin:80px auto}
  .susti{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);animation:sFade 4s ease forwards;pointer-events:none}
  .susti .emw{position:relative;text-align:center;height:125px}.susti .card{background:#2b1d10;border:3px solid #e8792b;border-radius:22px;padding:26px 34px;text-align:center;max-width:90vw;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:sPop .5s cubic-bezier(.2,1.6,.4,1)}
  .susti .em{font-size:110px;line-height:1;display:inline-block;animation:sSway 1.6s ease-in-out infinite;transform-origin:50% 90%}
  .susti .zz{position:absolute;font-size:30px;font-weight:900;color:#f5c04a;animation:sZz 2s ease-out infinite}
  .susti .tx{font-size:26px;font-weight:900;color:#ffb067;margin-top:14px}.susti .sm{font-size:15px;color:#e8d7c0;margin-top:6px}
  @keyframes sFade{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
  @keyframes sPop{from{transform:scale(.4)}to{transform:scale(1)}}
  @keyframes sSway{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
  @keyframes sZz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(40px,-70px) scale(1.3)}}
  .relief{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);animation:sFade 3s ease forwards;pointer-events:none;overflow:hidden}
  .relief .card{background:#13301c;border:3px solid #4caf50;border-radius:22px;padding:24px 36px;text-align:center;max-width:90vw;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:sPop .5s cubic-bezier(.2,1.6,.4,1)}
  .relief .em{font-size:110px;line-height:1.1;display:inline-block;animation:rJump 1s ease-in-out infinite}
  .relief .tx{font-size:28px;font-weight:900;color:#8fe39b;margin-top:8px}.relief .sm{font-size:16px;color:#d6f5da;margin-top:6px}
  .relief .fl{position:absolute;bottom:-60px;animation:rUp 2.6s ease-out forwards}
  @keyframes rJump{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(1.08)}}
  @keyframes rUp{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(-105vh) rotate(25deg);opacity:0}}
  .ikb{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;color:#3a1d05;background:#ffb067;border-radius:99px;padding:1px 8px;cursor:help;white-space:nowrap}
  .oiln{color:#8fe39b}.oiln.due{color:#f5c04a;font-weight:700}
</style>
</head>
<body>
<div id="login" class="box"><h3 style="margin:0;color:var(--gold)">Admin PIN</h3>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN" autofocus>
  <button class="btn gold" id="pinOk">Open</button><a href="/" style="color:var(--mute)">← POS par wapas</a></div>
<div class="wrap" id="main" style="display:none">
  <div class="bar"><div class="logo">PIZZA TOWN · ADMIN</div><a class="btn" href="/" style="text-decoration:none">← POS</a></div>
  <div class="tabs" id="tabs"><button data-t="menu">Menu &amp; Prices</button><button data-t="sales">Sales &amp; Profit</button><button data-t="exp">Kharcha</button><button data-t="stock">Stock</button><button data-t="set">Settings</button></div>
  <div id="view"></div>
</div>
<div id="toast"></div>
<script src="/fun.js"></script>
<script src="/admin.js"></script>
</body>
</html>
