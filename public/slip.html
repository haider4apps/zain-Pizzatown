<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slip</title>
<style>
  @font-face{font-family:'Gulzar';src:url(/fonts/gulzar-arabic-400.woff2) format('woff2');font-weight:400;font-display:block}
  /* --s = slip ka size (Admin > Settings > Slip font size se aata hai). 1.3 = 130% */
  :root{--s:1.3;--f:calc(1px * var(--s))}
  html,body{margin:0;padding:0;background:#fff;color:#000}
  body{font-family:'Gulzar','Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Segoe UI','Tahoma','Arial',sans-serif;font-size:calc(14 * var(--f));line-height:1.9;font-weight:700;margin:0 auto;padding:0 3mm}
  .slip{page-break-after:always;break-after:page;padding-top:0;padding-bottom:1mm}
  .slip:last-child{page-break-after:auto;break-after:auto}
  .c{text-align:center}
  .shop{font-size:calc(26 * var(--f));font-weight:800;letter-spacing:1px;line-height:1.3;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
  .small{font-size:calc(12 * var(--f));line-height:1.6}
  .title{font-size:calc(18 * var(--f));font-weight:800;border:2px solid #000;display:inline-block;padding:0 12px;margin:4px 0}
  hr{border:0;border-top:2px dashed #000;margin:6px 0}
  .row{display:flex;justify-content:space-between;direction:rtl;gap:6px}
  .row .v{direction:ltr;unicode-bidi:isolate;text-align:left;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
  .items{direction:ltr}
  .it{display:grid;grid-template-columns:1fr calc(7mm * var(--s)) calc(14mm * var(--s));gap:4px;font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:calc(13 * var(--f));line-height:1.35;padding:2px 0}
  .it.h{font-family:inherit;font-weight:800;border-bottom:1px solid #000;line-height:1.7}
  .it .q{text-align:center}.it .a{text-align:right}
  .grand{font-size:calc(20 * var(--f));font-weight:800;border-top:2px solid #000;border-bottom:2px solid #000;margin-top:4px;padding:2px 0}
  .big{font-size:calc(38 * var(--f));font-weight:800;line-height:1.2;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
  .k{direction:ltr;font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:calc(20 * var(--f));font-weight:800;line-height:1.25;padding:3px 0;border-bottom:1px dotted #000}
  .k .q{display:inline-block;min-width:calc(34 * var(--f))}
  .k small{display:block;font-size:calc(12 * var(--f));font-weight:600}
  .note{direction:rtl;font-size:calc(15 * var(--f));border:1px solid #000;padding:0 4px;margin:2px 0}
  .extra{direction:rtl;font-size:calc(15 * var(--f));font-weight:800;border-inline-start:4px solid #000;padding:0 6px;margin:2px 0}
  .en .extra{direction:ltr}
  .box{border:3px solid #000;text-align:center;margin:6px 0;padding:2px}
  .en .row,.en .note,.en .addr{direction:ltr}
  .en .row .v{text-align:right}
  .en{font-family:'Segoe UI',Tahoma,Arial,sans-serif}
  .addr{direction:rtl;white-space:pre-wrap;word-break:break-word}
  @media screen{body{width:76mm;box-shadow:0 0 8px #888;margin-top:10px}.slip{border-bottom:1px dashed #999;margin-bottom:10px}}
  @media print{body{box-shadow:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/slip.js"></script>
</body>
</html>
